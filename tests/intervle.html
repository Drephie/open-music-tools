<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intervle tests</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0 auto; padding: 16px; max-width: 900px; background: Canvas; color: CanvasText; }
    h1 { font-size: 1.4rem; }
    #summary { font-size: 1.2rem; font-weight: 700; }
    .pass { color: green; } .fail { color: #d22; }
    table { border-collapse: collapse; width: 100%; }
    td, th { text-align: left; padding: 4px 8px; border-bottom: 1px solid GrayText; vertical-align: top; }
    pre { white-space: pre-wrap; word-break: break-word; font-size: 12px; margin: 4px 0 0; }
  </style>
</head>
<body>
  <h1>intervle/game.js tests</h1>
  <p id="summary">Running…</p>
  <table>
    <thead><tr><th>Check</th><th>Checked</th><th>Result</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <p>Every puzzle of three years is checked against what it claims. The same checks run from the terminal: <code>tools/run-intervle-test.js</code>.</p>

<script type="module">
  import * as theory from '../shared/theory.js';
  import * as game from '../intervle/game.js';
  import { checkGame } from './intervle-cases.js';

  const rows = document.getElementById('rows');
  const summary = document.getElementById('summary');
  let failed = 0, total = 0;
  try {
    for (const row of checkGame(game, theory)) {
      total++;
      if (row.failed) failed++;
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${row.section}</td><td>${row.checked}</td><td class="${row.failed ? 'fail' : 'pass'}">${row.failed ? `FAIL (${row.failed})` : 'pass'}</td>`;
      if (row.examples.length) {
        const pre = document.createElement('pre');
        pre.textContent = row.examples.join('\n');
        tr.children[0].appendChild(pre);
      }
      rows.appendChild(tr);
    }
  } catch (err) {
    failed++;
    rows.innerHTML += `<tr><td colspan="3" class="fail"><pre></pre></td></tr>`;
    rows.querySelector('tr:last-child pre').textContent = String(err && err.stack || err);
  }
  summary.className = failed ? 'fail' : 'pass';
  summary.textContent = failed ? `FAIL: ${failed} of ${total} checks failed` : `PASS: all ${total} checks passed`;
</script>
</body>
</html>
