<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Chordigits</title>
  <meta name="description" content="Chordigits: count chords on your fingers, I to VII, in front of your camera; tilt for major or minor. A free, open-source music tool that runs in your browser; nothing is uploaded.">
  <meta name="theme-color" content="#0f1419">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.json">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js" integrity="sha384-c6Uo4N9c3SOEigMVzP6IshUG1wQ5uMp3xeoQFiHWAQ86joWdgyajkvopySyKy/Z6" crossorigin="anonymous" defer></script>
  <link rel="stylesheet" href="../shared/fonts/fonts.css">
  <link rel="stylesheet" href="../shared/ui/themes.css">
  <link rel="stylesheet" href="../shared/ui/select.css">
  <link rel="stylesheet" href="../shared/ui/page.css">
  <link rel="stylesheet" href="chordigits.css">
</head>
<body data-theme="liquid">
<script>/* The saved theme before the first paint, so pages never flash Liquid Glass (page.js checks it afterwards). */try{var l=JSON.parse(localStorage.getItem('open-music-tools.look.v1'));if(l&&/^[a-z0-9]+$/.test(l.theme))document.body.dataset.theme=l.theme}catch(e){}</script>
  <video id="webcam" autoplay playsinline muted aria-hidden="true"></video>
  <canvas id="overlay" aria-hidden="true"></canvas>
  <div id="theme-frame" aria-hidden="true"></div>
  <div class="page">
    <header class="tool-header">
      <h1 class="tool-title" data-i18n="title">Chordigits</h1>
      <div class="header-actions">
        <a class="icon-btn home-btn" href="../" data-i18n-aria="home" aria-label="Home: all the tools">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5.5h4V20"/></svg>
        </a>
        <button id="record-btn" class="icon-btn" data-i18n-aria="recordAria" aria-label="Record">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6" fill="currentColor"/></svg><span id="rec-time" class="rec-time"></span>
        </button>
        <button id="help-btn" class="icon-btn" data-i18n-aria="howTitle" aria-label="How to play">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M9.6 9.4a2.5 2.5 0 0 1 4.9.8c0 1.7-2.5 2.2-2.5 3.8"/><circle cx="12" cy="17.2" r="0.6" fill="currentColor"/></svg>
        </button>
        <button id="about-btn" class="icon-btn" data-i18n-aria="about" aria-label="About">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v6"/><circle cx="12" cy="7.5" r="0.6" fill="currentColor"/></svg>
        </button>
        <button id="settings-btn" class="icon-btn" data-i18n-aria="settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </header>

    <main class="cdg">
      <div id="chord" class="cdg-chord" hidden>
        <div id="chord-name" class="cdg-name"></div>
        <div id="chord-sub" class="cdg-sub"></div>
      </div>
      <p id="chord-live" class="visually-hidden" role="status" aria-live="polite"></p>

      <section id="start-card" class="panel cdg-start" hidden>
        <p id="start-msg" class="mic-msg"></p>
        <div class="cdg-start-btns">
          <button id="no-camera" class="btn btn-primary" data-i18n="noCamera">Play without the camera</button>
          <button id="start-camera" class="btn" data-i18n="retry">Retry</button>
        </div>
      </section>

      <p id="status" class="cdg-status" role="status"></p>

      <section class="panel cdg-bar">
        <div id="numbers" class="cdg-numbers" role="group" data-i18n-aria="numbersAria" aria-label="Chord numbers"></div>
        <div class="cdg-kinds">
          <div id="qualities" class="cdg-chips" role="group" data-i18n-aria="qualityAria" aria-label="Major or minor">
            <button class="btn chip" data-q="0" aria-pressed="true" data-i18n="qKey">as in the key</button>
            <button class="btn chip" data-q="1" aria-pressed="false" data-i18n="qMaj">major</button>
            <button class="btn chip" data-q="-1" aria-pressed="false" data-i18n="qMin">minor</button>
          </div>
          <div id="colors" class="cdg-chips" role="group" data-i18n-aria="colorAria" aria-label="Colour">
            <button class="btn chip" data-c="0" aria-pressed="true" data-i18n="cPlain">plain</button>
            <button class="btn chip" data-c="1" aria-pressed="false" data-i18n="c7">7th</button>
            <button class="btn chip" data-c="2" aria-pressed="false" data-i18n="cSus">sus4</button>
            <button class="btn chip" data-c="3" aria-pressed="false" data-i18n="cAdd9">add9</button>
          </div>
        </div>
      </section>
    </main>

    <footer class="tool-footer">
      <a class="support-link" href="https://patreon.com/drephie" target="_blank" rel="noopener noreferrer" data-i18n="supportLink">Support on Patreon</a>
      <span class="designer-credit"><span data-i18n="designedBy">Designed by</span> <a href="https://instagram.com/drephie" target="_blank" rel="noopener noreferrer">@drephie</a></span>
    </footer>
  </div>

  <div id="settings-modal" class="centered-modal" role="dialog" aria-modal="true" aria-labelledby="settings-title" tabindex="-1" style="display:none">
    <div class="modal-header">
      <h2 id="settings-title" data-i18n="settings">Settings</h2>
      <button class="close-btn" data-i18n-aria="closeAria" aria-label="Close">×</button>
    </div>
    <div class="pair">
      <div class="control-group">
        <label for="theme-select" data-i18n="theme">Theme</label>
        <div class="custom-select"><select id="theme-select"></select></div>
      </div>
      <div class="control-group">
        <label for="lang-select" data-i18n="lang">Language</label>
        <div class="custom-select"><select id="lang-select"></select></div>
      </div>
    </div>
    <div class="pair">
      <div class="control-group">
        <label for="key-select" data-i18n="keyLabel">Musical key</label>
        <div class="custom-select"><select id="key-select"></select></div>
      </div>
      <div class="control-group">
        <label for="notation-select" data-i18n="notation">Note names</label>
        <div class="custom-select"><select id="notation-select"><option value="letter">C D E</option><option value="solfege">Do Re Mi</option></select></div>
      </div>
    </div>
    <div class="pair">
      <div class="control-group">
        <label for="sound-select" data-i18n="sound">Sound</label>
        <div class="custom-select"><select id="sound-select"></select></div>
      </div>
      <div class="control-group">
        <label for="glide-select" data-i18n="glide">Glide (Dreamy synth)</label>
        <div class="custom-select"><select id="glide-select"><option value="on" data-i18n="on">On</option><option value="off" data-i18n="off">Off</option></select></div>
      </div>
    </div>
    <div class="control-group">
      <label for="volume-slider" data-i18n="volume">Volume</label>
      <input id="volume-slider" class="range" type="range" min="0" max="125" step="5" value="100">
    </div>
    <div class="pair">
      <div class="control-group">
        <label for="octave-select" data-i18n="octave">Octave</label>
        <div class="custom-select"><select id="octave-select"><option value="-1" data-i18n="octLow">Lower (−1)</option><option value="0" data-i18n="octMid">Middle (0)</option><option value="1" data-i18n="octHigh">Higher (+1)</option></select></div>
      </div>
      <div class="control-group">
        <label for="style-select" data-i18n="chordStyle">Chord style</label>
        <div class="custom-select"><select id="style-select"><option value="smooth" data-i18n="styleSmooth">Smooth (root in the bass)</option><option value="stacked" data-i18n="styleStacked">Stacked (root position)</option></select></div>
      </div>
    </div>
    <div class="pair">
      <div class="control-group">
        <label for="hand-select" data-i18n="handLayout">Hand layout</label>
        <div class="custom-select"><select id="hand-select"><option value="right" data-i18n="handRight">Right-handed</option><option value="left" data-i18n="handLeft">Left-handed</option></select></div>
      </div>
      <div class="control-group">
        <label for="six-select" data-i18n="sixSeven">Six and seven</label>
        <div class="custom-select"><select id="six-select"><option value="rock" data-i18n="sixRock">🤙 and 🤘</option><option value="asl" data-i18n="sixAsl">Sign language</option></select></div>
      </div>
    </div>
    <div class="control-group">
      <label for="brow-select" data-i18n="browSustain">Eyebrow sustain</label>
      <div class="custom-select"><select id="brow-select"><option value="on" data-i18n="on">On</option><option value="off" data-i18n="off">Off</option></select></div>
    </div>
  </div>

  <div id="how-modal" class="centered-modal" role="dialog" aria-modal="true" aria-labelledby="how-title" tabindex="-1" style="display:none">
    <div class="modal-header">
      <h2 id="how-title" data-i18n="howTitle">How to play</h2>
      <button class="close-btn" data-i18n-aria="closeAria" aria-label="Close">×</button>
    </div>
    <ul id="how-list" class="cdg-how"></ul>
    <button id="how-ok" class="btn btn-primary" data-i18n="howOk">Got it</button>
  </div>

  <div id="about-modal" class="centered-modal" role="dialog" aria-modal="true" aria-labelledby="about-title" tabindex="-1" style="display:none">
    <div class="modal-header">
      <h2 id="about-title" data-i18n="aboutTitle">About Chordigits</h2>
      <button class="close-btn" data-i18n-aria="closeAria" aria-label="Close">×</button>
    </div>
    <p class="about-text" data-i18n="aboutBody"></p>
    <p class="about-small" data-i18n="aboutThanks"></p>
    <p class="about-small" data-i18n="aboutCredits"></p>
    <a class="btn patreon-btn" href="https://patreon.com/drephie" target="_blank" rel="noopener noreferrer" data-i18n="supportLink">Support on Patreon</a>
    <p class="about-small computer-only" data-i18n="aboutKeys"></p>
  </div>

  <div id="rec-modal" class="centered-modal" role="dialog" aria-modal="true" aria-labelledby="rec-title" tabindex="-1" style="display:none">
    <div class="modal-header">
      <h2 id="rec-title" data-i18n="recChoiceTitle">Record</h2>
      <button class="close-btn" data-i18n-aria="closeAria" aria-label="Close">×</button>
    </div>
    <p class="about-text" data-i18n="recChoiceBody">What would you like to capture?</p>
    <label class="rec-voice"><input type="checkbox" id="rec-voice" checked> <span data-i18n="recVoice">Record my voice</span></label>
    <p class="about-small" data-i18n="recHeadphones"></p>
    <button id="rec-audio" class="btn" data-i18n="recAudio">Audio only</button>
    <button id="rec-screen" class="btn" data-i18n="recScreen">Screen + audio</button>
  </div>

  <div id="support-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="support-title" aria-describedby="support-body" style="display:none">
    <div class="centered-modal support-card">
      <button class="close-btn support-close" data-i18n-aria="closeAria" aria-label="Close" hidden>×</button>
      <h2 id="support-title" data-i18n="supportTitle">Support Chordigits</h2>
      <p id="support-body" data-i18n="supportBody"></p>
      <a class="btn patreon-btn" href="https://patreon.com/drephie" target="_blank" rel="noopener noreferrer" data-i18n="supportLink">Support on Patreon</a>
      <button class="btn support-continue" disabled></button>
    </div>
  </div>

  <div id="busy" class="cdg-busy" hidden><p class="panel" data-i18n="finalizing">Finishing your recording…</p></div>

  <div id="rotate" class="cdg-rotate">
    <svg viewBox="0 0 72 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="9" width="18" height="30" rx="3"/><rect x="40" y="18" width="28" height="18" rx="3"/><path d="M24 7c7-4 15-3 20 3"/><path d="M45 4v6h-6"/></svg>
    <h2 data-i18n="rotateTitle">Turn your phone sideways</h2>
    <p data-i18n="rotateBody"></p>
  </div>

  <script type="module" src="chordigits.js"></script>
</body>
</html>
